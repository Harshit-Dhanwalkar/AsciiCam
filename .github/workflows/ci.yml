name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "LICENCE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "LICENCE"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            platform: linux
            cc: gcc
            allow_failure: false
          - name: macos-arm64
            runner: macos-14
            platform: macos
            cc: clang
            allow_failure: false
          - name: macos-x86_64
            runner: macos-13
            platform: macos
            cc: clang
            allow_failure: false
          - name: windows-x86_64
            runner: windows-latest
            platform: windows
            cc: gcc
            allow_failure: true # HACK: bypass fail since dlfcn.h port still in progress

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential linux-libc-dev libv4l-dev ccache

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: brew install ccache || true

      - name: Install MinGW
        if: matrix.platform == 'windows'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          version: "12.2.0"

      - name: Install make (Windows)
        if: matrix.platform == 'windows'
        run: choco install make -y

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}-ccache
          max-size: 500M

      - name: Build (Unix)
        if: matrix.platform != 'windows'
        working-directory: C
        shell: bash
        run: |
          JOBS=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          make clean
          make -j"$JOBS" CC="${{ matrix.cc }}" all

      - name: Build (Windows / Git Bash)
        if: matrix.platform == 'windows'
        working-directory: C
        shell: bash
        run: |
          make clean
          make -j4 CC="${{ matrix.cc }}" all

      - name: Check for leaked glibc symbols (Linux nolibc build)
        if: matrix.platform == 'linux'
        working-directory: C
        shell: bash
        run: |
          ALLOWED='^(dlopen|dlsym|dlclose|dlerror)$'
          LEAKED=$(nm -D --undefined-only build/webcam_ascii \
                     | awk '{print $2}' | sed 's/@.*//' | sort -u \
                     | grep -Ev "$ALLOWED" || true)
          if [ -n "$LEAKED" ]; then
            echo "Leaked glibc symbol(s) in nolibc Linux build (expected only dlopen/dlsym/dlclose/dlerror):"
            echo "$LEAKED"
            exit 1
          fi
          echo "OK: only expected dl* symbols are dynamically undefined."

      - name: Smoke test --help (Unix)
        if: matrix.platform != 'windows'
        working-directory: C
        shell: bash
        run: ./build/webcam_ascii --help | head -20

      - name: Smoke test --help (Windows)
        if: matrix.platform == 'windows'
        working-directory: C
        shell: bash
        run: ./build/webcam_ascii.exe --help | head -20

      - uses: actions/upload-artifact@v5
        with:
          name: asciicam-${{ matrix.name }}
          path: |
            C/build/webcam_ascii*
            C/build/*.so
            C/build/*.dylib
            C/build/*.dll
          if-no-files-found: error

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential linux-libc-dev libv4l-dev \
            cppcheck clang-tidy
          pip install compiledb

      - name: Run cppcheck
        working-directory: C
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   -Iinclude -Ilib \
                   -i build \
                   src lib filters

      - name: Generate compilation database
        working-directory: C
        run: |
          make clean
          compiledb -n make

      - name: Run clang-tidy
        working-directory: C
        run: |
          find "$PWD/src" "$PWD/lib" "$PWD/filters" -name '*.c' \
              -not -path '*/build/*' \
            | xargs clang-tidy -p . \
                --warnings-as-errors='*' \
                --checks='-*,clang-analyzer-*,bugprone-*,performance-*' \
               || true
        # TODO: Once clean, drop `true` and add a .clang-tidy config.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "LICENCE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "LICENCE"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            platform: linux
            cc: gcc
            allow_failure: false
          - name: macos-arm64
            runner: macos-14
            platform: macos
            cc: clang
            allow_failure: false
          - name: macos-x86_64
            runner: macos-14
            platform: macos
            cc: clang
            extra-make-args: TARGET_ARCH=x86_64
            allow_failure: false
          - name: windows-x86_64
            runner: windows-latest
            platform: windows
            cc: gcc
            allow_failure: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential linux-libc-dev libv4l-dev ccache

      - name: Cache Homebrew downloads
        if: matrix.platform == 'macos'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: brew install ccache || true

      - name: Cache MinGW
        id: cache-mingw
        if: matrix.platform == 'windows'
        uses: actions/cache@v6
        with:
          path: C:\ProgramData\chocolatey\lib\mingw
          key: mingw-${{ runner.os }}-12.2.0

      - name: Install MinGW
        if: matrix.platform == 'windows' && steps.cache-mingw.outputs.cache-hit != 'true'
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64
          version: "12.2.0"

      - name: Add cached MinGW to PATH
        if: matrix.platform == 'windows' && steps.cache-mingw.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $mingw = 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin'
          if (-not (Test-Path $mingw)) {
            Write-Error "Cache hit but MinGW bin dir missing: $mingw"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $mingw
          Write-Host "MinGW restored from cache: $mingw"

      # - name: Install make (Windows)
      #   if: matrix.platform == 'windows'
      #   run: choco install make -y
      - name: Verify make (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: which make && make --version | head -1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}-ccache
          max-size: 500M

      - name: Build (Unix)
        if: matrix.platform != 'windows'
        working-directory: C
        shell: bash
        run: |
          JOBS=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          make clean
          make -j"$JOBS" CC="${{ matrix.cc }}" ${{ matrix.extra-make-args }} all

      - name: Build (Windows / Git Bash)
        if: matrix.platform == 'windows'
        working-directory: C
        shell: bash
        run: |
          make clean
          make -j4 CC="${{ matrix.cc }}" ${{ matrix.extra-make-args }} all

      - name: Thread tests (Linux nolibc)
        if: matrix.platform == 'linux'
        working-directory: C
        shell: bash
        run: |
          set -euo pipefail
          FLAGS="-D__LINUX_NOLIBC__ -DPLATFORM_LINUX -nostdinc -isystem $(gcc -print-file-name=include) -ffreestanding -fno-builtin -fno-stack-protector -nostdlib -static -Iinclude -Ilib"
          LIBS="lib/nl_printf.c lib/nl_errno.c lib/nl_alloc.c lib/nl_start.c"
          # the clone() child path once depended on register allocation and
          # only worked at -Os, so run the suite at several -O levels
          for O in -O0 -O2 -O3 -Os; do
            gcc $O $FLAGS tests/test_nl_thread.c $LIBS -o /tmp/t_thread
            /tmp/t_thread
          done

      - name: Verify zero libc dependency (Linux nolibc build)
        if: matrix.platform == 'linux'
        working-directory: C
        shell: bash
        run: |
          set -euo pipefail
          # 1. binary is fully static: no PT_INTERP, no DT_NEEDED, no dynamic symbols
          if readelf -lW build/webcam_ascii | grep -q INTERP; then
            echo "FAIL: webcam_ascii has PT_INTERP (dynamically linked)"; exit 1
          fi
          if readelf -d build/webcam_ascii 2>/dev/null | grep -q NEEDED; then
            echo "FAIL: webcam_ascii has DT_NEEDED entries"; exit 1
          fi
          # 2. plugins: no DT_NEEDED, and every undefined non-weak symbol must
          #    be one nl_dlopen() can resolve (listed in lib/nl_dlfcn.c's table)
          for so in build/*.so; do
            if readelf -d "$so" | grep -q NEEDED; then
              echo "FAIL: $so has DT_NEEDED entries"; exit 1
            fi
            for sym in $(nm -u "$so" | awk '$1=="U"{print $2}' | sed 's/@.*//'); do
              if ! grep -q "\"$sym\"" lib/nl_dlfcn.c; then
                echo "FAIL: $so needs '$sym' which nl_dlopen cannot resolve"; exit 1
              fi
            done
          done
          echo "OK: static binary, dependency-free plugins, all plugin symbols resolvable."

      - name: Unit tests (Linux nolibc)
        if: matrix.platform == 'linux'
        working-directory: C
        shell: bash
        run: |
          set -euo pipefail
          FLAGS="-D__LINUX_NOLIBC__ -DPLATFORM_LINUX -nostdinc -isystem $(gcc -print-file-name=include) -ffreestanding -fno-builtin -fno-stack-protector -nostdlib -static -Iinclude -Ilib"
          LIBS="lib/nl_printf.c lib/nl_errno.c lib/nl_alloc.c lib/nl_start.c"
          gcc $FLAGS tests/test_nl_alloc.c  $LIBS -o /tmp/t_alloc  && /tmp/t_alloc
          gcc $FLAGS tests/test_nl_printf.c $LIBS -o /tmp/t_printf && /tmp/t_printf
          gcc $FLAGS tests/test_nl_dlfcn.c lib/nl_dlfcn.c $LIBS -o /tmp/t_dlfcn && /tmp/t_dlfcn build
          # randomized stress test (fixed seeds => reproducible failures)
          gcc $FLAGS tests/fuzz_nolibc.c lib/nl_getopt.c $LIBS -o /tmp/t_fuzz
          for seed in 1 2 3; do /tmp/t_fuzz 100000 "$seed"; done

      - name: Smoke test --help (Unix)
        if: matrix.platform != 'windows'
        working-directory: C
        shell: bash
        run: ./build/webcam_ascii --help | head -20

      - name: Mouse + capture-resize tests (Linux nolibc)
        if: matrix.platform == 'linux'
        working-directory: C
        shell: bash
        run: |
          set -euo pipefail
          FLAGS="-D__LINUX_NOLIBC__ -DPLATFORM_LINUX -nostdinc -isystem $(gcc -print-file-name=include) -ffreestanding -fno-builtin -fno-stack-protector -nostdlib -static -Iinclude -Ilib"
          LIBS="lib/nl_printf.c lib/nl_errno.c lib/nl_alloc.c lib/nl_start.c"
          gcc $FLAGS tests/test_mouse.c src/mouse.c $LIBS -o /tmp/t_mouse
          /tmp/t_mouse
          # capture_reinit against a scripted fake camera (no hardware)
          for O in -O0 -O2; do
            gcc $O $FLAGS tests/test_capture_reinit.c src/capture_reinit.c $LIBS -o /tmp/t_reinit
            /tmp/t_reinit
          done

      - name: Smoke test --help (Windows)
        if: matrix.platform == 'windows'
        working-directory: C
        shell: bash
        run: ./build/webcam_ascii.exe --help | head -20

      - uses: actions/upload-artifact@v7
        with:
          name: asciicam-${{ matrix.name }}
          path: |
            C/build/webcam_ascii*
            C/build/*.so
            C/build/*.dylib
            C/build/*.dll
          if-no-files-found: error

  sanitize:
    name: Sanitize (linux-x86_64)
    runs-on: ubuntu-latest
    # NOTE: Only Linux nolibc build supports -DNL_SANITIZE_BUILD / make sanitize
    #       macOS uses system libc + clang (different sanitiser flags,)
    # TODO: Windows uses MinGW and has no libasan package
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential linux-libc-dev libv4l-dev \
            libasan8 libubsan1

      - name: Build with ASan+UBSan
        working-directory: C
        run: make sanitize

      - name: Smoke test (--help)
        working-directory: C
        env:
          # detect_leaks=1  : report memory leaks on exit
          # abort_on_error=1: exit non-zero on first error
          # print_stats=1   : print ASan internal stats on exit
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:print_stats=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/webcam_ascii_asan --help | head -20

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential linux-libc-dev libv4l-dev \
            cppcheck clang-tidy
          pip install compiledb

      - name: Run cppcheck
        working-directory: C
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   --suppress=knownConditionTrueFalse \
                   --suppress=unusedStructMember \
                   --suppress=syntaxError:lib/nl_syscall.h \
                   -D__linux__ -D__x86_64__ -D__GNUC__ \
                   -D__LINUX_NOLIBC__ -DPLATFORM_LINUX -DARCH_X86_64 \
                   -Iinclude -Ilib \
                   -i build \
                   src lib filters

      - name: Generate compilation database
        working-directory: C
        run: |
          make clean
          compiledb -n make

      - name: Run clang-tidy
        working-directory: C
        run: |
          find "$PWD/src" "$PWD/lib" "$PWD/filters" -name '*.c' \
              -not -path '*/build/*' \
            | xargs clang-tidy -p . \
                --warnings-as-errors='*' \
                --checks='-*,clang-analyzer-*,bugprone-*,performance-*' \
               || true
        # TODO: Once clean, drop `true` and add a .clang-tidy config.
